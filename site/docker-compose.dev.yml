services:
  site-web-dev:
    image: node:24-alpine
    working_dir: /src
    command: sh -c "npm ci --min-release-age=7 && npm run dev:docker"
    profiles: ["dev"]
    environment:
      ASTRO_TELEMETRY_DISABLED: "1"
      PUBLIC_CREWDAY_APP_ORIGIN: "${PUBLIC_CREWDAY_APP_ORIGIN:-http://127.0.0.1:${CREWDAY_APP_HOST_PORT:-8100}}"
    ports:
      - "127.0.0.1:${SITE_WEB_DEV_PORT:-18081}:4321"
    volumes:
      - ./web:/src
      - site-web-dev-node-modules:/src/node_modules
      - ../app/web/src/styles/tokens.css:/app/web/src/styles/tokens.css:ro

volumes:
  site-web-dev-node-modules:
