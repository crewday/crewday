services:
  site-web:
    build:
      context: ..
      dockerfile: site/web/Dockerfile
      args:
        PUBLIC_CREWDAY_APP_ORIGIN: "${PUBLIC_CREWDAY_APP_ORIGIN:-http://127.0.0.1:${CREWDAY_APP_HOST_PORT:-8100}}"
    restart: "no"
    volumes:
      - site-web-dist:/srv/www

  site-api:
    build:
      context: ./api
    restart: unless-stopped
    user: "10001:10001"
    environment:
      SITE_BIND_HOST: "0.0.0.0"
      SITE_BIND_PORT: "8001"
      SITE_PUBLIC_URL: "${SITE_PUBLIC_URL:-http://127.0.0.1:${SITE_HTTP_PORT:-18080}}"
    expose:
      - "8001"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    expose:
      - "80"
    ports:
      - "127.0.0.1:${SITE_HTTP_PORT:-18080}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - site-web-dist:/srv/www:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      site-web:
        condition: service_completed_successfully
      site-api:
        condition: service_started
    networks:
      - default
      - traefik-proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-proxy"
      - "traefik.http.routers.crewday-dev-site.rule=Host(`${CREWDAY_DEV_SITE_HOST:-crewday-site.localhost}`)"
      - "traefik.http.routers.crewday-dev-site.entrypoints=websecure"
      - "traefik.http.routers.crewday-dev-site.tls.certresolver=letsencrypt"
      # HSTS belongs on the TLS-terminating layer, not the plain-HTTP Caddy backend.
      - "traefik.http.middlewares.crewday-dev-site-hsts.headers.stsSeconds=63072000"
      - "traefik.http.middlewares.crewday-dev-site-hsts.headers.stsIncludeSubdomains=true"
      - "traefik.http.routers.crewday-dev-site.middlewares=crewday-dev-site-hsts@docker${CREWDAY_TRAEFIK_MIDDLEWARES:+,}${CREWDAY_TRAEFIK_MIDDLEWARES:-}"
      - "traefik.http.routers.crewday-dev-site.service=crewday-dev-site"
      - "traefik.http.services.crewday-dev-site.loadbalancer.server.port=80"

networks:
  traefik-proxy:
    external: true

volumes:
  site-web-dist:
  caddy-data:
  caddy-config:
