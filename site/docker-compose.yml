services:
  site-web:
    build:
      context: ..
      dockerfile: site/web/Dockerfile
    restart: "no"
    volumes:
      - site-web-dist:/srv/www

  site-api:
    build:
      context: ./api
    restart: unless-stopped
    user: "10001:10001"
    environment:
      SITE_BIND_HOST: "0.0.0.0"
      SITE_BIND_PORT: "8001"
      SITE_PUBLIC_URL: "${SITE_PUBLIC_URL:-https://dev.crew.day}"
    expose:
      - "8001"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    expose:
      - "80"
    ports:
      - "127.0.0.1:${SITE_HTTP_PORT:-18080}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - site-web-dist:/srv/www:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      site-web:
        condition: service_completed_successfully
      site-api:
        condition: service_started
    networks:
      - default
      - traefik-proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-proxy"
      - "traefik.http.routers.crewday-dev-site.rule=Host(`dev.crew.day`)"
      - "traefik.http.routers.crewday-dev-site.entrypoints=websecure"
      - "traefik.http.routers.crewday-dev-site.tls.certresolver=letsencrypt"
      - "traefik.http.routers.crewday-dev-site.middlewares=badger@file"
      - "traefik.http.routers.crewday-dev-site.service=crewday-dev-site"
      - "traefik.http.services.crewday-dev-site.loadbalancer.server.port=80"

networks:
  traefik-proxy:
    external: true

volumes:
  site-web-dist:
  caddy-data:
  caddy-config:
