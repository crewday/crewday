# crewday app dev stack. The default local front door is
# http://127.0.0.1:8100. Maintainers may also expose the stack through
# private hostnames by setting CREWDAY_DEV_APP_HOST / CREWDAY_DEV_SITE_HOST
# in a gitignored docker-compose.override.yml or shell environment.
#
# Topology (cd-g1cy — flipped from cd-sgpl so the FastAPI dev Vite
# proxy / WS HMR seam is exercised by every real-browser request):
#
#   http://127.0.0.1:8100/            → app-api (FastAPI)
#                                         ├─ /api, /events, …  →  real routers
#                                         └─ everything else   →  proxied to
#                                                                 web-dev:5173
#                                                                 (HTTP + WS HMR)
#
# Why FastAPI is the front door now: the dev profile enables an HTTP +
# WebSocket reverse proxy in ``app/api/proxy.py`` (cd-q1be + cd-354g)
# so a real browser hitting ``127.0.0.1:8100`` exercises the same
# single-origin shape we will ship in prod (compiled SPA + JSON API
# from the same FastAPI). HMR keeps working because the proxy upgrades
# Vite's ``vite-hmr`` WebSocket; the WS goes browser → FastAPI :8100
# → Vite :5173.
#
# Two app containers + Mailpit:
#
#   app-api        — the real ``app.main:create_app`` factory, SQLite
#                    under the named volume ``crewday-app-data:/data``.
#                    Bind-mounts the repo's ``app/`` so ``uvicorn
#                    --reload`` picks up .py edits; runs ``alembic
#                    upgrade head`` on boot. Published on the configured
#                    loopback host port and optionally joined to
#                    ``traefik-proxy`` for external private access.
#   web-dev        — Vite dev server for ``app/web/`` (the production
#                    SPA). Container-only — only ``app-api`` reaches it
#                    over the compose network at ``http://web-dev:5173``.
#   mailpit        — local SMTP sink; container ports stay at 1025/8025,
#                    host bindings use 1026/8026 to avoid shared-box
#                    conflicts.
#
# If you expose private maintainer hostnames through a reverse proxy,
# document the concrete resource names and auth behavior in
# .agents/local/SETUP.local.md. The bind guard rule (§15, §16, root
# AGENTS.md) still applies: no app port is published on a public
# interface; Traefik owns 80/443 and terminates externally.

name: "crewday-mocks"

services:
  # Production FastAPI application — ``app.main:create_app`` factory
  # against the real repo-root ``app/`` package. Bind-mounts keep
  # edits live (``uvicorn --reload``); ``alembic upgrade head`` runs
  # in the entrypoint so a fresh DB file is always at the current
  # schema head. The host-facing front door for the dev stack:
  # published on loopback and joined to ``traefik-proxy`` so an optional
  # private maintainer hostname can land here too. The dev profile turns on the
  # in-process Vite reverse proxy (``app/api/proxy.py``) so any
  # request that isn't an API / SSE path is forwarded to the
  # ``web-dev`` Vite container — HTTP for module loads, WebSocket
  # for HMR.
  app-api:
    build:
      context: .
      dockerfile: mocks/Dockerfile.app-api
    container_name: crewday-app-api
    restart: unless-stopped
    # Root entrypoint chowns ``/data`` (the named volume arrives
    # root-owned) and then drops to the ``crewday`` uid before
    # ``exec``ing uvicorn — see ``mocks/Dockerfile.app-api``.
    volumes:
      - ./app:/app/app:ro
      - ./migrations:/app/migrations:ro
      - ./alembic.ini:/app/alembic.ini:ro
      - ./pyproject.toml:/app/pyproject.toml:ro
      # Dev-only mount so ``docker compose exec app-api python -m
      # scripts.dev_login …`` works out of the box (cd-w1ia). The
      # production image does not ship scripts/; it's strictly a
      # dev affordance.
      - ./scripts:/app/scripts:ro
      - crewday-app-data:/data
    environment:
      CREWDAY_DATABASE_URL: "sqlite+aiosqlite:////data/crewday.db"
      CREWDAY_DATA_DIR: "/data"
      # Bind wildcard inside the container only — the process is never
      # published on the host, Traefik routes to it over the compose
      # network. ``CREWDAY_ALLOW_PUBLIC_BIND=1`` is required because the
      # factory's bind guard (§15 "Binding policy") refuses 0.0.0.0
      # without the explicit opt-in.
      CREWDAY_BIND_HOST: "0.0.0.0"
      CREWDAY_BIND_PORT: "8000"
      CREWDAY_ALLOW_PUBLIC_BIND: "1"
      CREWDAY_PROFILE: "dev"
      CREWDAY_VITE_DEV_URL: "http://web-dev:5173"
      CREWDAY_PUBLIC_URL: "${CREWDAY_PUBLIC_URL:-http://127.0.0.1:${CREWDAY_APP_HOST_PORT:-8100}}"
      CREWDAY_PUBLIC_SITE_URL: "${CREWDAY_PUBLIC_SITE_URL:-http://127.0.0.1:${SITE_HTTP_PORT:-18080}}"
      CREWDAY_WEBAUTHN_RP_ID: "${CREWDAY_WEBAUTHN_RP_ID:-127.0.0.1}"
      # DEV-ONLY signing secret — 64 hex chars (256 bits). NEVER a
      # production value; the compose file is world-readable in the
      # repo. Every prod deployment generates its own via the recipe
      # in ``docs/specs/16-deployment-operations.md``.
      CREWDAY_ROOT_KEY: "a086980eae3ed92658101eda4cab651ed4b8d4fafed4207f26446d9572b60eeb"
      CREWDAY_LOG_LEVEL: "INFO"
      # SMTP wiring points at the in-stack Mailpit sink so the signup /
      # magic-link / recovery routers mount (the factory skips them when
      # ``smtp_host`` / ``smtp_from`` are unset — §01 "Capability
      # registry"). The Mailer doesn't connect at construction; it only
      # opens a socket on the first outbound send, so a Mailpit that
      # isn't up (port-conflict etc.) doesn't block the app from booting.
      CREWDAY_SMTP_HOST: "mailpit"
      CREWDAY_SMTP_PORT: "1025"
      CREWDAY_SMTP_FROM: "${CREWDAY_SMTP_FROM:-crew.day dev <no-reply@localhost>}"
      CREWDAY_SMTP_USE_TLS: "0"
      # Dev-stack only; see scripts/dev-login.sh (cd-w1ia).
      CREWDAY_DEV_AUTH: "1"
      # DEV / E2E ONLY — DO NOT enable in production (cd-tblly).
      # Unset defaults to the deterministic fake client. To exercise
      # real OpenRouter locally, put CREWDAY_LLM_PROVIDER=openrouter
      # and CREWDAY_OPENROUTER_API_KEY=<key> in the gitignored root .env;
      # never put the key in this tracked compose file or docs.
      # The e2e override repeats fake values so CI stays keyless.
      CREWDAY_LLM_PROVIDER: "${CREWDAY_LLM_PROVIDER:-fake}"
      CREWDAY_OPENROUTER_API_KEY: "${CREWDAY_OPENROUTER_API_KEY:-}"
      CREWDAY_LLM_OCR_MODEL: "fake-ocr"
    expose:
      - "8000"
    ports:
      # Loopback-only host binding — the AGENTS.md bind guard forbids
      # publishing to the public interface. Host port 8100 (chosen for
      # historical parity with the previous Vite-front-door layout)
      # forwards to the FastAPI container's :8000.
      - "127.0.0.1:${CREWDAY_APP_HOST_PORT:-8100}:8000"
    healthcheck:
      test:
        - "CMD"
        - "curl"
        - "-fsS"
        - "http://127.0.0.1:8000/healthz"
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 3
    depends_on:
      - web-dev
    networks:
      - default
      - traefik-proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-proxy"
      - "traefik.http.routers.crewday-dev-app.rule=Host(`${CREWDAY_DEV_APP_HOST:-crewday-app.localhost}`)"
      - "traefik.http.routers.crewday-dev-app.entrypoints=websecure"
      - "traefik.http.routers.crewday-dev-app.tls.certresolver=letsencrypt"
      - "traefik.http.routers.crewday-dev-app.middlewares=${CREWDAY_TRAEFIK_MIDDLEWARES:-}"
      - "traefik.http.routers.crewday-dev-app.service=crewday-dev-app"
      # FastAPI's container-side port. The dev profile's Vite proxy
      # forwards SPA routes onward to ``web-dev:5173``; Traefik never
      # talks to the Vite container directly anymore.
      - "traefik.http.services.crewday-dev-app.loadbalancer.server.port=8000"

  # Vite dev server for ``app/web/`` (the production SPA). No host
  # port and no Traefik labels — the only consumer is the sibling
  # ``app-api`` container, which dials it over the compose network at
  # ``http://web-dev:5173`` (and ``ws://web-dev:5173`` for HMR).
  # ``CREWDAY_VITE_DEV_URL`` on ``app-api`` points here.
  web-dev:
    image: node:24-alpine
    container_name: crewday-web-dev
    restart: unless-stopped
    working_dir: /web
    # ``--no-package-lock`` keeps the host's ``package-lock.json`` from
    # being rewritten by the container-side install. Without it every
    # ``docker compose up`` mutates the lockfile (the bind-mount is
    # read-write) so every restart shows up as uncommitted churn.
    command: sh -lc "npm install --no-audit --no-fund --no-package-lock --min-release-age=7 && npm run dev -- --host 0.0.0.0"
    environment:
      # The browser never talks to Vite directly anymore (FastAPI is
      # the front door), so Vite's ``server.proxy`` config is
      # effectively dormant in this stack. The variables stay set for
      # parity with stand-alone ``vite dev`` runs outside compose
      # (``cd app/web && npm run dev``) and in case a future debug
      # session re-publishes Vite on the host.
      VITE_BACKEND_URL: "http://app-api:8000"
      VITE_CREWDAY_PUBLIC_SITE_URL: "${CREWDAY_PUBLIC_SITE_URL:-http://127.0.0.1:${SITE_HTTP_PORT:-18080}}"
    volumes:
      - ./app/web:/web
    expose:
      - "5173"
    networks:
      - default

  # Local SMTP sink for dev. Mailpit accepts any SMTP session on
  # container :1025 (no auth, no TLS). Its web UI + JSON API listen on
  # container :8025 so the operator can inspect what crewday would have
  # delivered in prod.
  # Ports are bound to 127.0.0.1 only per the AGENTS.md bind guard —
  # this container never needs to be reachable from outside the host.
  # Point ``CREWDAY_SMTP_HOST=mailpit`` / ``_PORT=1025`` at it from
  # app-api when wiring up magic-link / digest smoke tests.
  mailpit:
    image: axllent/mailpit:latest
    container_name: crewday-mailpit
    restart: unless-stopped
    ports:
      # Host bindings for inspection from the host only — app-api
      # reaches mailpit over the compose network by hostname, so these
      # are optional. The default host mapping uses 1026/8026 to avoid
      # common conflicts with another Mailpit on 1025/8025; keeping the
      # container-side ports at 1025/8025 means
      # CREWDAY_SMTP_HOST=mailpit / _PORT=1025 in app-api and the
      # internal UI at http://mailpit:8025 stay unchanged.
      - "127.0.0.1:${CREWDAY_MAILPIT_SMTP_HOST_PORT:-1026}:1025"
      - "127.0.0.1:${CREWDAY_MAILPIT_UI_HOST_PORT:-8026}:8025"
    networks:
      - default

networks:
  traefik-proxy:
    external: true

volumes:
  # SQLite file home for ``app-api``. Named volume so the DB survives
  # ``docker compose down`` but is wiped with ``docker compose down
  # -v`` when the operator wants a clean slate.
  crewday-app-data:
