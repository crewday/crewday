# CI — lint, type, import boundaries, unit, integration, e2e.
#
# Task: cd-4al (spec: docs/specs/17-testing-quality.md §"Quality gates",
# docs/specs/01-architecture.md §"Enforcement"). The e2e job is cd-asvl
# (spec: docs/specs/17-testing-quality.md §"End-to-end").
#
# Ten jobs:
#   * lint         — ruff check + ruff format --check
#   * type         — mypy --strict on app/ (extends to cli/ via cd-j202
#                    once that tree exists)
#   * react-doctor — React Doctor score 100 / zero diagnostics for active
#                    React surfaces (app/web + site/web; mocks excluded).
#   * i18n-keys    — committed gettext catalogs and SPA JSON bundles
#                    match the extracted source keys.
#   * openapi      — ``docs/api/openapi.json`` matches the live FastAPI
#                    schema (cd-uky5). Standalone gate because the CLI
#                    codegen and parity check both read this file as
#                    their source of truth — without this job a stale
#                    commit would silently pass cli-parity.
#   * cli-parity   — committed CLI surfaces match current OpenAPI and
#                    the resolved Click command tree.
#   * boundaries   — import-linter. Blocking check as of cd-ev0 — a
#                    red result fails the build. Contracts live in
#                    pyproject.toml under [tool.importlinter].
#   * tenant-agnostic — every tenant_agnostic() escape hatch carries a
#                    `# justification:` comment (cd-6f2na). Blocking
#                    static AST gate; see docs/specs/01-architecture.md
#                    §"Tenant filter enforcement".
#   * unit         — pytest tests/unit tests/api tests/property tests/llm
#                    on SQLite only (the default).
#   * integration  — pytest tests/integration on both SQLite (default)
#                    and Postgres 15 via testcontainers (cd-rhaj). The
#                    PG shard spins up a disposable postgres:15-alpine
#                    container inside the test process; no workflow-
#                    level services block is needed because the runner
#                    (ubuntu-latest) ships Docker preinstalled.
#   * tenant       — pytest tests/tenant (cross-tenant isolation matrix
#                    + repository/HTTP/event/worker surface-parity gates,
#                    §17 "Tenant isolation"). Same 2-shard sqlite/postgres
#                    database matrix as integration.
#   * e2e          — pytest tests/e2e against the dev stack (compose
#                    bring-up + Playwright Chromium/WebKit). Single
#                    Python (3.14) — browser tests don't benefit from
#                    a version matrix and CI minutes are precious.
#                    Uploads tests/e2e/_artifacts and tests/e2e/_diff
#                    on failure for post-mortem.
#
# Matrix over Python 3.14 on every job except e2e.
# integration and tenant additionally matrix database = [sqlite, postgres]
# (2 shards each on those jobs).

name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "site/**"
      - "docs/specs-site/**"
      - ".github/workflows/site-ci.yml"
  pull_request:
    paths-ignore:
      - "site/**"
      - "docs/specs-site/**"
      - ".github/workflows/site-ci.yml"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install deps
        run: uv sync --group dev
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format --check
        run: uv run ruff format --check .

  type:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install deps
        run: uv sync --group dev
      # cd-j202 will extend this to `uv run mypy app cli` once the CLI
      # tree exists. Until then mypy only sweeps app/.
      - name: mypy --strict app
        run: uv run mypy app

  react-doctor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            app/web/package-lock.json
            site/web/package-lock.json
      - name: Install app web deps
        run: npm --prefix app/web ci
      - name: Install site web deps
        run: npm --prefix site/web ci
      - name: React Doctor
        run: ./scripts/react-doctor-gate.sh

  csp-inlines:
    # Built SPA must carry no un-nonced inline <script>/<style> (cd-wv2v,
    # cd-ro0f5; spec docs/specs/15-security-privacy.md §"HTTP security
    # headers"). The strict CSP served by SecurityHeadersMiddleware only
    # accepts nonced inlines; an un-nonced one is silently refused by the
    # browser and bricks the SPA with no server-side error. Build the
    # production SPA so app/web/dist exists, then scan it. ``vite build``
    # skips the ``tsc -b`` prelude on purpose — TS type-check is a
    # separate concern and running it here would red-fail this gate on
    # unrelated TS noise (same rationale as the e2e surface-manifest
    # step). The checker is stdlib-only (html.parser), so no ``uv sync``
    # is needed — the setup-python interpreter runs it directly.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install app web deps
        run: npm --prefix app/web ci
      - name: Build SPA
        run: npx vite build
        working-directory: app/web
      - name: CSP inline check
        run: python scripts/check_csp_inlines.py app/web/dist

  i18n-keys:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install deps
        run: uv sync --group dev
      - name: i18n catalog freshness
        run: make i18n-check

  openapi:
    # Committed ``docs/api/openapi.json`` must match the live FastAPI
    # schema. Before cd-uky5 the cli-parity job booted the live app
    # and used its schema directly, so drift between live and
    # committed openapi.json was caught implicitly. Post-refactor the
    # CLI codegen + parity check both read the committed file, so an
    # explicit gate is needed — otherwise a stale commit silently
    # passes cli-parity. Pairs with ``make openapi`` for local
    # regeneration; failure prints the path the developer should run.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install deps
        run: uv sync --group dev
      - name: openapi schema freshness
        run: make openapi-check

  cli-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install deps
        run: uv sync --group dev
      - name: CLI parity
        run: uv run python scripts/cli_parity_check.py

  openapi-agent-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install deps
        run: uv sync --group dev
      - name: OpenAPI agent links
        run: make openapi-agent-links

  boundaries:
    # Blocking check as of cd-ev0. Contracts live in pyproject.toml
    # under [tool.importlinter]; see docs/specs/01-architecture.md
    # §"Module boundaries" and §"Boundary rules".
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install deps
        run: uv sync --group dev
      - name: lint-imports
        # import-linter discovers its config from pyproject.toml
        # ([tool.importlinter]).
        run: uv run lint-imports

  tenant-agnostic:
    # Blocking check (cd-6f2na). Every tenant_agnostic() escape hatch
    # from the workspace-scope filter MUST carry a `# justification:`
    # comment; see docs/specs/01-architecture.md §"Tenant filter
    # enforcement". Pure-stdlib AST gate — no dependency install needed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: tenant_agnostic justifications
        run: python scripts/check_tenant_agnostic.py app/

  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install deps
        run: uv sync --group dev
      - name: pytest (unit + api + property + llm, SQLite)
        run: uv run pytest tests/unit tests/api tests/property tests/llm -x -q

  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]
        database: [sqlite, postgres]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install deps
        run: uv sync --group dev
      - name: Select backend (sqlite)
        if: matrix.database == 'sqlite'
        # tests/integration/conftest.py defaults to SQLite when
        # CREWDAY_TEST_DB is absent; we set it explicitly anyway so
        # the shard's intent is visible in the job log.
        run: echo "CREWDAY_TEST_DB=sqlite" >> "$GITHUB_ENV"
      - name: Select backend (postgres)
        if: matrix.database == 'postgres'
        # testcontainers starts its own postgres:15-alpine container
        # inside the pytest process (cd-rhaj). The ubuntu-latest
        # runner has the Docker engine preinstalled, so no
        # services: block is needed — this shard stays aligned with
        # local dev where the same env var flips the backend.
        run: echo "CREWDAY_TEST_DB=postgres" >> "$GITHUB_ENV"
      - name: pytest (integration)
        run: uv run pytest tests/integration -x -q

  tenant:
    # Tenant-isolation suite (cd-zp9jp; spec
    # docs/specs/17-testing-quality.md §"Tenant isolation" —
    # ``pytest tests/tenant/`` on every PR; and
    # docs/specs/01-architecture.md §"Tenant filter enforcement"). The
    # cross-tenant regression matrix (§17 case (a)–(d)) plus the
    # repository / HTTP / event / worker surface-parity gates live here:
    # a new workspace-scoped surface added without a case or an explicit
    # opt-out fails the gate. Runs on both SQLite (app-filter only) and
    # Postgres 15 via testcontainers (RLS + app-filter), matching the
    # ``integration`` job's backend selection — the suite re-exports
    # tests/integration's engine / db_url / migrate_once fixtures, which
    # honour ``CREWDAY_TEST_DB``.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]
        database: [sqlite, postgres]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install deps
        run: uv sync --group dev
      - name: Select backend (sqlite)
        if: matrix.database == 'sqlite'
        run: echo "CREWDAY_TEST_DB=sqlite" >> "$GITHUB_ENV"
      - name: Select backend (postgres)
        if: matrix.database == 'postgres'
        run: echo "CREWDAY_TEST_DB=postgres" >> "$GITHUB_ENV"
      - name: pytest (tenant isolation)
        run: uv run pytest tests/tenant -x -q

  coverage:
    # Enforce the coverage floor (cd-ro0f5; spec
    # docs/specs/17-testing-quality.md §"Quality gates" — "85% domain,
    # 70% overall"). The floor lives in pyproject
    # [tool.coverage.report] ``fail_under``; pytest-cov reads it when
    # ``--cov-fail-under`` is absent (plugin.py: cov_config.fail_under)
    # and fails the session when total coverage drops below it. This
    # job re-runs the same PR test surface the ``unit`` and
    # ``integration`` jobs cover (SQLite) under ``--cov=app`` so a
    # change that erodes coverage trips here. ``tests/tenant`` runs in
    # its own dedicated ``tenant`` job (cd-zp9jp) and is intentionally
    # excluded from this coverage aggregate: the floor is measured over
    # the unit + integration surface, and the tenant matrix is a
    # cross-tenant *isolation* gate (surface-parity + fail-closed
    # assertions), not a coverage contributor. Single Python (3.14) —
    # the floor is version-independent.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install deps
        run: uv sync --group dev
      - name: pytest (coverage floor, SQLite)
        run: uv run pytest tests/unit tests/api tests/property tests/llm tests/integration --cov=app --cov-report=term-missing

  schemathesis:
    # API contract sweep (cd-3j25, spec
    # ``docs/specs/17-testing-quality.md`` §"API contract" +
    # §"Quality gates"). Boots the FastAPI app under ``uvicorn``,
    # mints a Bearer token via the seed helper, then runs
    # ``schemathesis run`` with the custom checks under
    # ``tests/contract/hooks.py`` registered through
    # ``SCHEMATHESIS_HOOKS``.
    #
    # **Blocking once the included operation set is clean.** Today
    # the gate runs against a curated allowlist in
    # ``scripts/schemathesis_run.sh`` (``INCLUDE_ARGS``); broadening
    # it surfaces ~270 real schema-conformance bugs the spec wants
    # fixed first. Per-context follow-up Beads tasks track the
    # cleanup; each one widens the include list. The CI step is
    # blocking from day one — if the gate flags a regression on the
    # narrow set, the PR doesn't merge.
    #
    # Single Python (3.14) — schemathesis is HTTP-out-of-process so
    # the version matrix that lint/type/unit run buys nothing here.
    # Budget per §17 is < 5 min; the runner caps at
    # ``--max-examples=20`` per operation, well inside that.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install deps
        run: uv sync --group dev
      - name: schemathesis (contract sweep)
        # The runner script handles uvicorn lifecycle, seed helper,
        # token mint, and tear-down. ``make schemathesis`` is the
        # same gate developers run locally so the CI surface stays
        # predictable.
        run: make schemathesis

  e2e:
    # Browser-driven journeys (cd-asvl, spec
    # docs/specs/17-testing-quality.md §"End-to-end"). Brings up the
    # full dev stack via docker-compose.dev.yml, then runs
    # tests/e2e/ headless on Chromium + WebKit. Single Python — the
    # version matrix on browser tests buys nothing and roughly doubles
    # CI minutes. Failure artefacts (trace.zip, video, screenshots,
    # pixel diffs) are uploaded for post-mortem.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install deps
        run: uv sync --group dev
      - name: Cache Playwright browsers
        # Browser binaries (~250 MB for Chromium + WebKit) live under
        # ``~/.cache/ms-playwright`` and only change when the
        # ``playwright`` package version moves. Keying on ``uv.lock``
        # invalidates exactly when that pin shifts. The system-deps
        # apt packages (``--with-deps`` below) can't be cached as
        # easily — apt installs are fast enough that the win is the
        # browser download, not the library install.
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - name: Install Playwright browsers + system deps
        # ``--with-deps`` chains ``playwright install-deps`` so libicu,
        # libnss3, libwebpdemux2, … land via apt. Without it WebKit
        # SKIPs locally with a missing-shared-library trace; the §17
        # acceptance criteria requires WebKit to actually run on CI.
        # Two browsers only — Firefox isn't in the §17 surface. When
        # the browser cache hits, ``install`` becomes a no-op for the
        # browser binaries themselves and ``install-deps`` still runs
        # the apt step (system libs are not cached).
        run: uv run playwright install --with-deps chromium webkit
      - name: Pre-create traefik-proxy network
        # ``docker-compose.dev.yml`` declares ``traefik-proxy`` as an
        # external network (the dev box's shared Traefik lives there).
        # GHA runners don't have it, so compose would refuse to bring
        # the stack up with ``network … declared as external, but could
        # not be found``. app-api joins it for hostname routing; in CI
        # we just need the network to exist — Traefik itself isn't
        # running. ``|| true`` lets the step idempotent on re-runs
        # (``network create`` errors if the name already exists).
        run: docker network create traefik-proxy || true
      - name: Bring up dev stack
        env:
          CREWDAY_PUBLIC_URL: "http://localhost:8100"
          CREWDAY_WEBAUTHN_RP_ID: "localhost"
          CREWDAY_LLM_PROVIDER: "fake"
          CREWDAY_ICAL_ALLOW_PRIVATE_ADDRESSES: "1"
          CREWDAY_RATE_LIMIT_ANONYMOUS_PER_MINUTE: "10000"
          CREWDAY_RATE_LIMIT_TOKEN_PER_MINUTE: "10000"
          CREWDAY_RATE_LIMIT_PERSONAL_ME_PER_MINUTE: "10000"
        run: docker compose -f docker-compose.dev.yml up -d --build
      - name: Wait for app-api healthz
        # The compose healthcheck has start_period=30s and retries=3;
        # we poll the loopback port the web-dev Vite container
        # publishes (127.0.0.1:8100) which proxies /healthz through to
        # app-api. The cold-start path on a hosted runner stacks four
        # slow phases:
        #   * Docker image build for app-api (pip install ~30 deps)
        #   * alembic upgrade head against a fresh SQLite file
        #   * ``npm install`` inside web-dev (no node_modules cache;
        #     ``--no-package-lock`` forces a full resolve), then Vite
        #     startup
        #   * proxy /healthz round-trip
        # 240s gives that path comfortable headroom — empirically the
        # cold path is ~2-3 min on ubuntu-latest. If the dev stack
        # still isn't green, dump compose state + tail logs for triage
        # and fail.
        run: |
          set -euo pipefail
          deadline=$(( SECONDS + 240 ))
          until curl -fsS http://127.0.0.1:8100/healthz >/dev/null; do
            if (( SECONDS >= deadline )); then
              echo "::error::dev stack not healthy after 240s"
              docker compose -f docker-compose.dev.yml ps
              docker compose -f docker-compose.dev.yml logs --tail=200
              exit 1
            fi
            sleep 2
          done
          echo "dev stack healthy after ${SECONDS}s"
      - name: Emit SPA surface manifest (cd-qv2l)
        # The §17 360 px sitemap walker reads the authenticated route
        # list from ``app/web/dist/_surface.json`` (emitted by the
        # ``crewday:emit-surface-manifest`` Vite plugin at build time).
        # The dev compose stack only runs ``vite dev`` — no production
        # build, no manifest — so without this step the helper falls
        # back to the 5-route :data:`PILOT_AUTHENTICATED_ROUTES` smoke
        # subset and regressions on stays / scheduler / templates / etc.
        # slip through CI.
        #
        # We piggyback on the ``web-dev`` container which already
        # finished ``npm install`` during stack bring-up (waited on by
        # the healthz gate above). ``vite build`` skips the SPA's
        # ``tsc -b`` prelude — type-check is owned by the standalone
        # ``type`` job; running it here would double-charge CI for the
        # same gate and red-fail the e2e job on unrelated TS noise.
        # The bind-mount (``./app/web:/web``) means the emitted
        # ``/web/dist/_surface.json`` lands on the host filesystem at
        # ``app/web/dist/_surface.json`` — exactly where the helper
        # reads it.
        run: |
          set -euo pipefail
          docker compose -f docker-compose.dev.yml exec -T web-dev npx vite build
          test -s app/web/dist/_surface.json
          echo "surface manifest emitted ($(wc -c <app/web/dist/_surface.json) bytes)"
      - name: pytest (e2e)
        # ``-v`` because failures here drive a slower triage loop than
        # unit/integration; per-test names in the log are worth the
        # noise. ``--tracing=retain-on-failure`` /
        # ``--video=retain-on-failure`` / ``--screenshot=only-on-failure``
        # match the AGENTS.md §"End-to-end Playwright suite" pinned
        # invocation. ``-n0`` overrides the project-wide
        # ``addopts = "… -n auto …"`` (pyproject.toml
        # ``[tool.pytest.ini_options]``) — xdist would otherwise fork
        # one pytest worker per CPU, each racing for the same
        # ``127.0.0.1:8100`` dev stack and the shared
        # ``tests/e2e/_artifacts/`` output dir. The conftest already
        # routes artefacts under that dir via ``--output``.
        # ``CREWDAY_REQUIRE_SURFACE_MANIFEST`` makes the sitemap
        # helper fail if the build step above did not leave a usable
        # ``app/web/dist/_surface.json``; CI must never drop back to
        # the 5-route smoke subset.
        env:
          CREWDAY_REQUIRE_SURFACE_MANIFEST: "1"
        run: uv run pytest tests/e2e -v -n0 --tracing=retain-on-failure --video=retain-on-failure --screenshot=only-on-failure
      - name: Upload e2e artefacts
        # Failure-only — green runs would otherwise upload empty
        # (or near-empty) directories. ``if-no-files-found: ignore``
        # because tests/e2e/_diff/ is only populated when a visual
        # baseline drifts; absence on a Chromium-only failure is fine.
        # Retention 7d — long enough to triage a Monday-morning red
        # build, short enough to keep storage costs sane.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artefacts
          path: |
            tests/e2e/_artifacts/
            tests/e2e/_diff/
          retention-days: 7
          if-no-files-found: ignore
      - name: Tear down dev stack
        # Always run — leaked containers between jobs would chew
        # through the runner disk and confuse a re-run on the same
        # ephemeral VM. ``-v`` wipes the SQLite volume so subsequent
        # runs start from a clean slate.
        if: always()
        run: docker compose -f docker-compose.dev.yml down -v
